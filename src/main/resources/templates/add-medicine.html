<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Medicine</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="auth-page">

    <div class="form-container">

        <h1>Medical Store Management</h1>
        <h2>Add Medicine</h2>

        <p
            class="error"
            th:if="${error}"
            th:text="${error}">
        </p>

        <form action="/medicines/add" method="post">

            <div class="form-group">
                <label>Medicine Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter medicine name"
                    required>
            </div>

            <div class="form-group">
                <label>Available Stock</label>

                <input
                    type="number"
                    name="stock"
                    placeholder="Enter available stock"
                    min="0"
                    required>
            </div>

            <button type="submit">
                Add Medicine
            </button>

        </form>

        <p>
            <a href="/medicines">← Back to Medicines</a>
        </p>

    </div>

</div>

</body>
</html>
